<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang Thi Thử Trắc Nghiệm</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="quiz-container">
      <div class="setup-container" id="setup-box">
        <h3>CẤU HÌNH BÀI THI</h3>
        <label for="questionCount">Số lượng câu hỏi:</label>
        <select id="questionCount">
          <option value="1">bộ đề 1</option>
          <option value="2" selected>bộ đề 2</option>
          <option value="3">bộ đề 3</option>
          <option value="4">bộ đề 4</option>
          <option value="5">bộ đề 5</option>
          <option value="6">bộ đề 6</option>
        </select>
        <br /><br />
        <button onclick="(displayQuestions(), start())" class="btn-start">
          BẮT ĐẦU THI NGAY
        </button>
      </div>
      <h1>Luyện thi đấu thầu</h1>
      <div class="timer-container1">
        <div id="view-question"></div>
      </div>
      <div id="quiz"></div>
      <div class="timer-container">
        <button id="submit1" onclick="location.reload()">Quay Lại</button>
        <button id="submit1" onclick="location.reload()">Thi Tiếp</button>
        <button id="submit">Nộp bài</button>
        <div class="timer-display" id="timer"></div>
      </div>
      <div id="results"></div>
    </div>

    <script src="a.js"></script>

    <script src="script.js"></script>
  </body>
</html>
